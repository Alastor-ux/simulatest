:root{--f1:"Press Start 2P","Courier New",monospace;--f2:"VT323","Courier New",monospace;--bg:#150d2e;--p:#2b1a5c;--p2:#4b2fb0;--y:#ffd93d;--g:#4ade80;--r:#f87171;--c:#38bdf8;--o:#fb923c;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}

html,body{margin:0;min-height:100%;background:var(--bg);color:#fff;font:20px/1.25 var(--f2);overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body{background:none}body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:5;background:repeating-linear-gradient(0deg,#0000 0 3px,#0002 3px 4px)}#bg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated}

@keyframes bob{50%{transform:translateY(-6px)}}h2{font:400 clamp(13px,4.2vw,18px)/1.6 var(--f1);color:var(--y);text-shadow:3px 3px 0 #000;text-align:center}
.sub{text-align:center;color:var(--c);margin-bottom:14px}
.box{background:#2b1a5cd9;border:4px solid #000;box-shadow:inset 0 0 0 3px var(--p2),6px 6px 0 #000;padding:14px;margin:12px 0}
.btn,.chip,.card{font:400 12px/1.5 var(--f1);color:#000;border:4px solid #000;cursor:pointer}
.btn{display:block;width:100%;min-height:54px;margin:10px 0;padding:10px;text-transform:uppercase;background:var(--y);box-shadow:inset -4px -4px 0 #0003,inset 4px 4px 0 #fff5,5px 5px 0 #000}

.g{background:var(--g)}.c{background:var(--c)}.o{background:var(--o)}.r{background:var(--r)}.k{background:#cbd5e1}
.opt{font:400 23px/1.15 var(--f2);background:#3b2a85;color:#fff;text-transform:none;text-align:left}.opt.ok{background:var(--g);color:#000}.opt.no{background:var(--r);color:#000}.opt.dim{opacity:.55}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{background:#2b1a5cd9;color:#fff;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:inset 0 0 0 3px var(--p2),5px 5px 0 #000}
.card small{color:#c4b5fd;font-weight:400}.go{background:var(--g);color:#000;padding:4px 8px;border:3px solid #000;margin-top:4px}
.chip{background:#e2e8f0;padding:8px 12px;margin:3px;min-height:44px}.chip.sel{background:var(--y);outline:4px solid #fff}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.bar{height:18px;background:#000;border:3px solid #000;box-shadow:inset 0 0 0 2px #fff3;margin:6px 0}.bar i{display:block;height:100%;background:var(--g);transition:width .3s steps(8)}
input,select,textarea{width:100%;font:400 22px var(--f2);padding:10px;border:4px solid #000;background:#fff;color:#000;margin:6px 0}
.qt{font-size:25px;line-height:1.25;margin:6px 0}.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .4s steps(4)}@keyframes pop{50%{transform:scale(1.3)}}
.px{position:fixed;top:25%;width:9px;height:9px;pointer-events:none;z-index:9;animation:fall 1s steps(10) forwards}@keyframes fall{to{transform:translate(var(--dx),70vh) rotate(180deg);opacity:0}}

.big{font-size:40px;text-align:center}.lock{opacity:.4;filter:grayscale(1)}small{font-size:17px}.ib{display:grid;place-items:center;width:64px;height:64px;background:linear-gradient(135deg,#5b3fd6,#2b1a5c);border:4px solid #000;box-shadow:inset 0 0 0 2px #8b6cff,3px 3px 0 #000}.i{width:24px;height:24px;vertical-align:middle;margin:-4px 3px -4px 0}.btn .i,h2 .i{width:32px;height:32px}.big .i{width:48px;height:48px;margin:0 4px}.chip .i,small .i{width:20px;height:20px}.ib .i{width:52px;height:52px;margin:0}

.btn:active,.card:active{transform:translate(2px,3px);filter:brightness(1.25);box-shadow:0 0 0 2px var(--bc,#19d8e8),0 0 10px var(--gw,#19d8e855)}
.btn.g{--bc:#37ff9a;--tc:#c4ffe0;--b1:#0f4a37;--b2:#06281f;--gw:#37ff9a66}.btn.c{--bc:#38bdf8;--tc:#c4ecff;--b1:#0e3a52;--b2:#061f30;--gw:#38bdf866}.btn.o{--bc:#ffb347;--tc:#ffe3b0;--b1:#4a3513;--b2:#2a1c08;--gw:#ffb34755}.btn.r{--bc:#ff5d73;--tc:#ffc9d1;--b1:#4a1a24;--b2:#2a0c12;--gw:#ff5d7355}.btn.k{--bc:#6fa3a8;--tc:#c9e2e4;--b1:#143236;--b2:#0a1b1e;--gw:#6fa3a833}
.opt{display:block;text-align:left;text-shadow:none;--tc:#e4fff4;background:linear-gradient(180deg,#0b343a,#04191d)}.opt b{color:#37ff9a}.opt .i{width:22px;height:22px;display:inline-block}.opt.ok{--bc:#37ff9a;--tc:#fff;background:linear-gradient(180deg,#14804f,#0a4a30)}.opt.no{--bc:#ff5d73;--tc:#fff;background:linear-gradient(180deg,#8a2a3a,#4a1220)}.opt.dim{opacity:.5}.opt::before,.opt::after{display:none}
.chip{color:#9bffe0;background:#052a30;border:2px solid #0e6d78;border-radius:5px;text-shadow:0 0 6px #19e6c0;box-shadow:0 0 8px #19d8e822,inset 0 2px 0 #ffffff14}.chip.sel{background:#0c5a52;border-color:#37ff9a;color:#e0fff0;outline:0;box-shadow:0 0 12px #37ff9a88,inset 0 0 0 2px #37ff9a44}

.ib{background:radial-gradient(circle,#0e5058,#04191d);border:3px solid #02090b;border-radius:8px;box-shadow:0 0 0 2px #19d8e8aa,0 0 10px #19d8e844}
.sub{color:#9bffe0;text-shadow:0 0 8px #19e6c0,2px 2px 0 #000;font-size:22px}
h2{color:#9bffe0;text-shadow:0 0 10px #19e6c0,3px 3px 0 #000}h2::after{content:"";display:block;height:4px;margin:10px auto 0;width:55%;background:linear-gradient(90deg,transparent,#19d8e8,transparent);box-shadow:0 0 8px #19d8e8}

/* portada */
.in:has(.hm){animation:none}
.hm{position:relative;display:flex;flex-direction:column;min-height:calc(100vh - 24px);min-height:calc(100dvh - 24px)}
.tb{display:flex;justify-content:space-between}
.ib2{width:54px;height:54px;display:grid;place-items:center;padding:0;background:linear-gradient(180deg,#0b343a,#04191d);border:3px solid #02090b;border-radius:9px;box-shadow:0 0 0 2px #19d8e8,0 0 12px #19d8e888;cursor:pointer}.ib2 .i{width:32px;height:32px;margin:0;filter:drop-shadow(0 0 4px #19e6c0)}
.hmt{text-align:center;margin-top:-6px}.tt{display:block;width:100%;max-width:520px;margin:0 auto;mix-blend-mode:screen;animation:tp 2.8s ease-in-out infinite}@keyframes tp{50%{filter:brightness(1.2) drop-shadow(0 0 8px #19d8e8)}}
.rec{display:inline-flex;align-items:center;gap:8px;margin-top:-8px;padding:7px 20px;font:400 12px var(--f1);color:#bff8e6;text-shadow:0 0 8px #19e6c0;background:#031a1ce6;border:2px solid #19d8e8;border-radius:6px;box-shadow:0 0 12px #19d8e877}.rec .i{width:28px;height:28px;margin:0}
.cat{flex:1 1 0;min-height:70px;margin:0 -12px;overflow:hidden;mix-blend-mode:screen;-webkit-mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent);mask-image:linear-gradient(transparent,#000 20%,#000 80%,transparent)}.cat img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 72%;animation:cg 4.5s ease-in-out infinite}@keyframes cg{50%{filter:brightness(1.4) saturate(1.2);transform:scale(1.03)}}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:0 10px;margin-top:6px}.menu .btn{margin:7px 0;min-height:58px;padding:8px 6px;font-size:clamp(8px,2.5vw,10px);line-height:1.35}.menu .btn .i{width:26px;height:26px;filter:grayscale(1) sepia(1) hue-rotate(118deg) saturate(2.6) brightness(1.2) drop-shadow(0 0 3px #19e6c0)}
.menu .btn:first-child{grid-column:1/-1;min-height:72px;font-size:clamp(18px,6.5vw,26px);letter-spacing:3px;text-shadow:0 0 12px #37ff9a,3px 3px 0 #000}.menu .btn:first-child .i{width:46px;height:46px}
.tag{display:flex;align-items:center;gap:10px;margin:8px 0 2px;font:400 clamp(8px,2.4vw,10px) var(--f1);color:#7fd9c4;letter-spacing:2px;text-shadow:0 0 6px #19e6c0;white-space:nowrap}.tag i{flex:1;height:2px;background:linear-gradient(90deg,transparent,#19d8e8aa)}.tag i:last-child{background:linear-gradient(270deg,transparent,#19d8e8aa)}

body[data-o=l] .tb{grid-area:tb}body[data-o=l] .hmt{grid-area:hmt;margin:0}body[data-o=l] .menu{grid-area:menu;margin:0}body[data-o=l] .tag{grid-area:tag}body[data-o=l] .tt{max-width:330px}
